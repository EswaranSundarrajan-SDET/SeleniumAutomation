name: Selenium CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Each browser writes its own report and verifies that UI scenarios overlap.
  browser-tests:
    name: Selenium (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    env:
      BROWSER: ${{ matrix.browser }}
      HEADLESS: 'true'
      REPORTS_DIR: ${{ github.workspace }}/AutomationTests/Reports/${{ matrix.browser }}
      SOLUTION: Web_API_Automation.sln
      TEST_PROJECT: AutomationTests/AutomationTests.csproj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore "$SOLUTION"
      - name: Build
        run: dotnet build "$SOLUTION" -c Release --no-restore
      - name: Run scenarios
        id: scenarios
        run: dotnet test "$TEST_PROJECT" -c Release --no-build --filter "TestCategory=ui" --logger "trx;LogFileName=selenium.trx" --results-directory "$REPORTS_DIR"
      - name: Verify scenarios ran in parallel
        run: python3 .github/scripts/verify-parallel-results.py "$REPORTS_DIR/selenium.trx" 33
      - name: Verify HTML report and automation log
        if: ${{ !cancelled() && steps.scenarios.outcome != 'skipped' }}
        run: test -s "$REPORTS_DIR/Automation Execution Results.html" && test -s "$REPORTS_DIR/automation.log"
      - name: Upload HTML, TRX, and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-${{ matrix.browser }}
          path: ${{ env.REPORTS_DIR }}/
          if-no-files-found: warn
